<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:image" content="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#326318" />
    <meta
      name="description"
      content="CapNong — Nông sản xấu mã, ngon thật. Khám phá rau củ theo mùa, combo gia đình và túi mù nông sản."
    />
    <title>CapNong · Nông sản xấu mã – Ngon thật</title>

    <!-- Google Fonts: Be Vietnam Pro & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#fcf9f1;font-family:'Be Vietnam Pro',sans-serif;color:#20271c;user-select:none;">
        <div style="position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,0.22);filter:blur(18px);animation:cn-pulse 2.2s ease-in-out infinite;"></div>
          <svg viewBox="0 0 160 160" style="position:absolute;inset:0;width:100%;height:100%;">
            <defs>
              <linearGradient id="cn-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#86efac" stop-opacity="0"/>
                <stop offset="60%" stop-color="#22c55e" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#15803d" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <circle cx="80" cy="80" r="70" fill="none" stroke="#326318" stroke-width="1.2" stroke-opacity="0.12"/>
            <g style="transform-origin:80px 80px;animation:cn-spin 2.2s linear infinite;">
              <circle cx="80" cy="80" r="70" fill="none" stroke="url(#cn-grad-1)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="140 320"/>
            </g>
            <circle cx="80" cy="80" r="54" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 4"/>
            <g style="transform-origin:80px 80px;animation:cn-spin-rev 3s linear infinite;">
              <circle cx="80" cy="80" r="54" fill="none" stroke="#84cc16" stroke-width="2" stroke-linecap="round" stroke-dasharray="80 260"/>
            </g>
          </svg>
          <img src="/logo-icon.png" alt="CapNong" style="position:relative;z-index:2;width:56px;height:56px;object-fit:contain;animation:cn-float 2.2s ease-in-out infinite;"/>
        </div>
        <div style="margin-top:20px;text-align:center;">
          <div style="font-size:15px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#2b591b;">CapNong</div>
          <div style="font-size:12px;font-weight:600;color:#55624d;margin-top:4px;">Đang chuẩn bị nông sản tươi ngon...</div>
          <div style="width:110px;height:4px;border-radius:99px;background:rgba(43,89,27,0.1);margin:12px auto 0;overflow:hidden;">
            <div style="width:100%;height:100%;background:linear-gradient(90deg,transparent,#22c55e,transparent);animation:cn-shimmer 1.8s ease-in-out infinite;"></div>
          </div>
        </div>
        <style>
          @keyframes cn-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
          @keyframes cn-spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
          @keyframes cn-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.05)}}
          @keyframes cn-pulse{0%,100%{opacity:0.25;transform:scale(0.9)}50%{opacity:0.7;transform:scale(1.2)}}
          @keyframes cn-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
